 const st=$("rs"+i),b=$("rb"+i),R=window.SpeechRecognition||window.webkitSpeechRecognition;
 const say=(t,e)=>{st.textContent=t;st.className="sub"+(e?" err":"")};
 if(RC){try{RC.stop()}catch(e){}return}
 if(!R){say("이 브라우저는 음성 인식을 지원하지 않아요. 크롬·엣지·사파리에서 열거나 아래에 직접 입력해 주세요.",1);return}
 pbStop();
 const r=new R();RC=r;r.lang="en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
 r.onstart=()=>{b.textContent="⏹ 녹음 중… (누르면 종료)";b.classList.add("act");say("듣고 있어요. 문장을 읽어 주세요.")};
 r.onresult=e=>{let t="";for(const x of e.results)t+=x[0].transcript;$("a"+i).value=t;ans[i]=t};
 r.onerror=e=>{const m={"not-allowed":"마이크 사용이 차단되어 있어요. 주소창의 마이크 권한을 허용하거나, 이 페이지를 새 탭에서 열어 주세요.","service-not-allowed":"이 환경에서는 음성 인식을 쓸 수 없어요. 새 탭에서 열거나 직접 입력해 주세요.","no-speech":"음성이 들리지 않았어요. 다시 눌러 말해 보세요.","audio-capture":"마이크를 찾을 수 없어요.","network":"음성 인식 서버에 연결하지 못했어요."};say(m[e.error]||("음성 인식 오류: "+e.error),1)};
 r.onend=()=>{RC=null;b.textContent="🎤 따라 읽기";b.classList.remove("act");if(!st.classList.contains("err"))say("인식 완료! 아래 내용을 확인하고 채점하세요.")};
 try{r.start()}catch(e){RC=null;say("녹음을 시작할 수 없어요: "+e.message,1)}}
const W=t=>String(t).toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
async function submit(){
 done=true;$("sub").disabled=true;let pts=0;const n=items.length;
 const show=(i,ok,html)=>{const e=$("e"+i);e.hidden=false;e.innerHTML=html;$("q"+i).style.borderColor=ok?"var(--ok)":"var(--no)"};
 if(skill==="speaking"){items.forEach((it,i)=>{const t=W(it.target),a=new Set(W(ans[i]||""));const m=t.filter(w=>a.has(w)).length/t.length,ok=m>=.7;pts+=ok?1:0;show(i,ok,`${ok?"✅":"❌"} 일치율 ${Math.round(m*100)}% (70% 이상 통과)\n💡 ${esc(it.tip)}`)})}
 else if(skill==="writing"&&items[0].bk){items.forEach((it,i)=>{const t=W(it.model),a=new Set(W(ans[i]||"")),m=t.filter(w=>a.has(w)).length/t.length,ok=m>=.6;pts+=ok?1:0;show(i,ok,`${ok?"✅":"✏️"} 핵심 단어 일치율 ${Math.round(m*100)}% (60% 이상 통과)\n🎯 ${esc(it.points)}\n\n📝 모범 답안: ${esc(it.model)}`)})}
 else if(skill==="writing"){res.innerHTML='<div class="msg">AI가 작문을 채점하는 중…</div>';
  try{const sample=await claude.use("sample");const r=await sample.json(`Grade these Korean student's English writing answers (grade ${GR[+g.value]}). For each, give score 0-100 and 2-3 sentences of constructive feedback in Korean (strength, one correction, a better version). Input: ${JSON.stringify(items.map((it,i)=>({task:it.prompt,model:it.model,points:it.points,student:ans[i]||""})))}. Return ONLY a JSON array [{"score":number,"feedback":string}] in order.`,{cache:false});
  items.forEach((it,i)=>{const x=r[i]||{score:0,feedback:""},ok=x.score>=60;pts+=ok?1:0;show(i,ok,`${ok?"✅":"✏️"} ${x.score}점\n${esc(x.feedback)}\n\n📝 모범 답안: ${esc(it.model)}`)})}
  catch(e){res.innerHTML='<div class="msg err">채점에 실패했어요. 다시 시도해 주세요.</div>';done=false;$("sub").disabled=false;return}}
 else{items.forEach((it,i)=>{const ok=ans[i]===it.answer;pts+=ok?1:0;it.options.forEach((_,k)=>{const b=$(`o${i}_${k}`);if(k===it.answer)b.classList.add("ok");else if(k===ans[i])b.classList.add("no")});show(i,ok,`${ok?"✅ 정답!":"❌ 오답"}\n${esc(it.explanation)}`)})}
 res.innerHTML=`<div class="card" style="margin-top:14px"><div class="score">${pts} / ${n}점</div><div class="sub">${pts===n?"완벽해요! 🎉":pts>=n/2?"잘했어요! 틀린 문제를 복습해 보세요.":"괜찮아요, 해설을 읽고 다시 도전해 보세요 💪"}</div></div>`;
 res.scrollIntoView({behavior:"smooth"})}
</script></body></html>
